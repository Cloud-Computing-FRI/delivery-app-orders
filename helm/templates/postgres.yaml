{{/*
This service's own in-cluster PostgreSQL. Rendered only when postgresql.enabled
is true (dev/staging); prod disables this and points DATABASE_URL at a managed
database instead. The database is private to this chart -- no other service can
reach it.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orders.fullname" . }}-db
  labels:
    {{- include "orders.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orders.fullname" . }}-db-init
  labels:
    {{- include "orders.labels" . | nindent 4 }}
data:
  init.sql: |
    {{- .Files.Get "files/init.sql" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders.fullname" . }}-db
  labels:
    {{- include "orders.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "orders.name" . }}
    app.kubernetes.io/component: orders-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "orders.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orders-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "orders.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: orders-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.db | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.user | quote }}, "-d", {{ .Values.postgresql.auth.db | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.user | quote }}, "-d", {{ .Values.postgresql.auth.db | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "orders.fullname" . }}-db
        - name: init
          configMap:
            name: {{ include "orders.fullname" . }}-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orders.fullname" . }}-db
  labels:
    {{- include "orders.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "orders.name" . }}
    app.kubernetes.io/component: orders-db
spec:
  selector:
    app.kubernetes.io/name: {{ include "orders.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orders-db
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
