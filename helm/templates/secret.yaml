{{/*
This service's DATABASE_URL Secret, created only when database.manageSecret is
true (dev/staging, in-cluster Postgres). In prod the chart creates nothing here;
database.existingSecret names a Secret created out of band that points at the
managed database, so no password lives in git.
*/}}
{{- if .Values.database.manageSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orders.fullname" . }}-db
  labels:
    {{- include "orders.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ include "orders.dbHost" . }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
{{- end }}
